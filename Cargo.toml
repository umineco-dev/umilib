[package]
name = "umilib"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Umineco Library: platform-independent no_std types and implementations of codecs, hashes, cryptography, protocols and authentication."
repository = "https://github.com/umineco-dev/umilib"
readme = "README.md"
keywords = ["no_std", "protocol", "cryptography", "codec", "ffi"]
categories = ["no-std", "cryptography", "network-programming", "encoding", "compression"]
include = ["/Cargo.toml", "/Cargo.lock", "/build.rs", "/src", "/include", "/LICENSE", "/README.md"]
autotests = false
autobenches = false

[lib]
crate-type = ["rlib"]
bench = false

[[test]]
name = "features"
path = "tests/features/main.rs"

[[test]]
name = "bytes"
path = "tests/bytes/main.rs"
required-features = ["bytes"]

[[test]]
name = "calendar"
path = "tests/calendar/main.rs"
required-features = ["calendar"]

[[test]]
name = "secret"
path = "tests/secret/main.rs"
required-features = ["secret"]

[[test]]
name = "codec"
path = "tests/codec/main.rs"
required-features = ["codec"]

[[test]]
name = "crypto"
path = "tests/crypto/main.rs"
required-features = ["crypto", "hash"]

[[test]]
name = "hash"
path = "tests/hash/main.rs"
required-features = ["hash"]

[[test]]
name = "math"
path = "tests/math/main.rs"
required-features = ["math"]

[[test]]
name = "protocol"
path = "tests/protocol/main.rs"
required-features = ["protocol", "hash-sha"]

[[test]]
name = "auth"
path = "tests/auth/main.rs"
required-features = ["auth", "codec-json", "hash-md", "hash-sha"]

[[test]]
name = "runtime"
path = "tests/runtime/main.rs"
required-features = ["runtime"]

[[test]]
name = "service"
path = "tests/service/main.rs"
required-features = ["service"]

[[test]]
name = "ffi"
path = "tests/ffi/main.rs"
required-features = ["ffi"]

[[test]]
name = "platform"
path = "tests/platform/main.rs"
required-features = ["platform"]

[[test]]
name = "fuzz"
path = "fuzz/main.rs"
harness = false
required-features = ["platform-fuzz"]

[[example]]
name = "echo"
path = "examples/echo.rs"
required-features = ["platform-runtime"]

[[example]]
name = "tls"
path = "examples/tls.rs"
required-features = ["platform-native", "protocol-tls", "crypto-hpke", "codec-base-base64", "auth-cert-ocsp"]

[[example]]
name = "quic"
path = "examples/quic.rs"
required-features = ["platform-native", "protocol-quic"]

[[example]]
name = "http"
path = "examples/http.rs"
required-features = ["platform-native", "protocol-http", "protocol-tls", "protocol-quic", "codec-gzip"]

[[example]]
name = "dns"
path = "examples/dns.rs"
required-features = ["platform-native", "protocol-dns"]

[[example]]
name = "coap"
path = "examples/coap.rs"
required-features = ["platform-native", "protocol-coap"]

[[example]]
name = "dhcp"
path = "examples/dhcp.rs"
required-features = ["platform-native", "protocol-dhcp"]

[[example]]
name = "smtp"
path = "examples/smtp.rs"
required-features = ["protocol-smtp"]

[[example]]
name = "pop3"
path = "examples/pop3.rs"
required-features = ["protocol-pop-v3", "hash-md-v5", "secret"]

[[example]]
name = "integrated"
path = "examples/integrated.rs"
required-features = ["auth-oauth", "auth-sasl-oauthbearer", "codec-mail", "platform-runtime", "protocol-http-v1", "protocol-imap-v4", "protocol-pop-v3", "protocol-smtp", "service"]

[[example]]
name = "imap"
path = "examples/imap.rs"
required-features = ["protocol-imap-v4"]

[[example]]
name = "ftp"
path = "examples/ftp.rs"
required-features = ["protocol-ftp"]

[[example]]
name = "tun"
path = "examples/tun.rs"
required-features = ["platform-linux", "protocol-icmp", "protocol-udp", "protocol-tcp"]

[[bench]]
name = "bench"
path = "benches/main.rs"
harness = false
required-features = ["platform-bench"]

# Feature rules (see .docs/feature-system.md):
# - "-" separates path segments: "a-b-c" is src/a/b/c and umilib::a::b::c.
# - A parent feature lists all of its direct children.
# - An alias lists exactly one canonical feature and has no directory.
# - One feature per line; build.rs and tests/features read this table.
