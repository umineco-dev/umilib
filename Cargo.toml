[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

# The tests run the full Monte Carlo procedures of NIST CAVP, which take
# minutes without optimization; debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
