# Runs the benchmarks on demand and uploads the JSON results. CI runners are
# noisy, so results are recorded, not compared automatically; see docs/bench.md.
name: Bench

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Run only benchmarks whose name contains this text.
        default: ""

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo bench --all-features --locked -- ${FILTER:+"$FILTER"} --json "bench-$RUNNER_OS.json"
        shell: bash
        env:
          FILTER: ${{ inputs.filter }}
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-*.json
